<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxy Conquer</title>
  <style>
    /* Reset and full-screen canvas */
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <!-- Background music element -->
  <audio id="bgm" src="assets/background_music.mp3" loop></audio>
  <script src="main.js"></script>
</body>
</html>
